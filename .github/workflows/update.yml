name: Update NOAA data

on:
  schedule:
    # NOAA publishes new climdiv county files once a month, usually in the
    # first ~10 days (e.g. the Nov 2026 release was processed on the 5th).
    # Run on the 10th and again on the 20th as a fallback for late releases;
    # nothing is committed when the data hasn't changed.
    - cron: "0 12 10,20 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install Python and dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Download data and build parquet files
        run: uv run --no-project python fl_noaa_time_series.py

      - name: Re-run exploratory notebook
        run: uv run --no-project jupyter nbconvert --execute --to notebook --inplace Exploratory.ipynb

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add temp.parquet precipitation.parquet Exploratory.ipynb
          if git diff --cached --quiet -- temp.parquet precipitation.parquet; then
            echo "No new data; nothing to commit."
          else
            git commit -m "Update data ($(date -u +%Y-%m-%d))"
            git push
          fi
